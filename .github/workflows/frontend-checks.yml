name: Frontend regression checks

on:
  pull_request:
    paths:
      - 'sociogram-frontend/**'
      - '.gitignore'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'sociogram-frontend/**'
      - '.gitignore'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sociogram-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sociogram-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
